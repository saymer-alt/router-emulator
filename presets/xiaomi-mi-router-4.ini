; Board preset for the Router Emulator.
; Keys other than name/description/ram/dump-dir are -M machine options.
; MediaTek MT7621A (MIPS 1004Kc): machine mt7621-router on qemu-system-mipsel.
; MT7530 ports: 1 = lan2, 2 = lan1; PHY 4 = wan, muxed through port 5 to
; GMAC1 (not a switch port).  Parallel NAND (flash-type=parallel-nand).
[preset]
name=Xiaomi Mi Router 4 (stock U-Boot)
description=MT7621A, 3x1G (WAN on GMAC1 + 2 LAN on the MT7530), DDR3 128 MB, NAND 128 MB, stock Xiaomi U-Boot 1.1.3 (boots OpenWrt as System 2), no USB, Wi-Fi MT7603E 2.4 GHz + MT7612E 5 GHz on PCIe (radio silent)
soc=mt7621
flash-type=parallel-nand
flash-id=c2f18095
ports=-:lan2:lan1:-:wan
ddr=ddr3
ram=128
usb-port=none
reset-gpio=18
wps-gpio=12
pcie0=mt7603e
pcie1=mt7612e
dump-dir=nand-mi-router-4
openwrt=xiaomi_mi-router-4
openwrt-stock=xiaomi-mi-router-4
; LEDs (tools/dts-leds.py from mt7621_xiaomi_mi-router-4.dts)
led1=Status: yellow gpio:10:low + blue gpio:8:low + red gpio:6:low
