; Board preset for the Router Emulator.
; Keys other than name/description/ram/dump-dir are -M machine options.
; MT7531 port 0 = WAN, ports 1..4 = lan1..lan4.  OpenWrt (DSA) uses GMAC0
; only; the SNR firmware (MediaTek SDK, VLAN 2 = ports 0 + 5) takes WAN
; through GMAC1, linked to MT7531 port 5 (gmac1=mt7531-p5).
[preset]
name=SNR-CPE-AX2
description=5x1G MT7531 (WAN = port 0, GMAC1 on switch port 5), DDR3 256 MB, NAND 128 MB, no USB
gmac0=mt7531
ports=wan:lan1:lan2:lan3:lan4
gmac1=mt7531-p5
flash-type=nand
flash-id=efaa21
ddr=ddr3
ram=256
usb-port=none
reset-gpio=1
; mesh button
wps-gpio=0
dump-dir=nand-snr-cpe-ax2
openwrt=snr_snr-cpe-ax2
openwrt-no-bdinfo=1
led1=Status: blue gpio:9:low + red gpio:5:low
led2=WAN: blue gpio:10:low + red gpio:4:low
led3=Mesh: blue gpio:11:low
led4=Wi-Fi 2.4G: blue gpio:6:low
led5=Wi-Fi 5G: blue gpio:7:low
