; Board preset for the Router Emulator.
; Keys other than name/description/ram/dump-dir are -M machine options.
; Boots from the SPI-NOR (SPI2); the system is in UBI on the SPI-NAND
; (SPI0, rutos-a / rutos-b).  OpenWrt has no bootloader for the RUTC50:
; the Teltonika one is replaced by the OpenWrt MT7981 RFB SPI-NOR BL2 and
; the U-Boot of tools/uboot-rutc50 (boots rutos-a with ubi.mtd=rutos-a,
; as the Teltonika bootloader does).  The mobile, SIM and signal LEDs are
; on a 74HC595 on SPI1; the mobile modem (USB) is not emulated.
[preset]
name=Teltonika RUTC50
description=MT7981A, 1G WAN built-in PHY on GMAC1, 4x1G LAN MT7531, DDR3 512 MB, SPI-NOR 16 MB + SPI-NAND 512 MB, USB 2.0 (modem not emulated)
flash-type=nor
flash-id=ef4018
flash2-id=efaa23
gmac0=mt7531
ports=lan4:lan3:lan2:lan1:-
gmac1=gphy
gmac1-port=wan
ddr=ddr3
ram=512
usb-port=2
reset-gpio=6
dump-dir=nor-rutc50
openwrt=teltonika_rutc50
; NOR + NAND folder: tools/prepare-nand.sh --nor-nand rutc50
openwrt-nor-nand=rutc50
; LEDs (tools/dts-leds.py from mt7981a-teltonika-rutc50.dts)
led1=WAN: amber phy:0:0 + green phy:0:1
led2=Power: green gpio:15:low
led3=WAN Ethernet: green gpio:0
led4=WAN Wi-Fi: green gpio:1
led5=SIM 1: green hc595:1:0
led6=SIM 2: green hc595:1:7
led7=Wi-Fi 2.4G: green gpio:14
led8=Wi-Fi 5G: green gpio:5:low
led9=3G: green hc595:1:6
led10=4G: green hc595:1:5
led11=5G: green hc595:1:4
led12=Signal 1: green hc595:1:3
led13=Signal 2: green hc595:1:2
led14=Signal 3: green hc595:1:1
