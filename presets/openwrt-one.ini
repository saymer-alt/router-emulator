; Board preset for the Router Emulator.
; Keys other than name/description/ram/dump-dir are -M machine options.
; SPI-NAND boot (the boot switch at NAND); the SPI-NOR holds the recovery
; bootloader and system (switch at NOR: flash-type=nor, flash-id=ef4018,
; flash2-id=efaa22).
[preset]
name=OpenWrt One
description=MT7981B, 2.5G WAN Airoha EN8811H on GMAC0, 1G LAN built-in PHY on GMAC1, DDR4 1 GB, SPI-NAND 256 MB + SPI-NOR 16 MB, USB 2.0
flash-type=nand
flash-id=efaa22
flash2-id=ef4018
gmac0=en8811h
; EN8811H at MDIO address 15, reset GPIO 39
gmac0-phy-addr=15
gmac0-port=wan
gmac0-reset-gpio=39
gmac1=gphy
gmac1-port=lan
ddr=ddr4
ram=1024
usb-port=2
reset-gpio=1
wps-gpio=0
dump-dir=nor-openwrt-one
openwrt=openwrt_one
; NOR + NAND folder: tools/prepare-nand.sh --nor-nand openwrt-one
openwrt-nor-nand=openwrt-one
; LEDs (tools/dts-leds.py from mt7981b-openwrt-one.dts)
led1=Status: white pwm:0 + green pwm:1 + red gpio:9
led2=WAN: amber phy:15:0 + green phy:15:1
led3=LAN: amber gpio:34:low + green gpio:35:low
