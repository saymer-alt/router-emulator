; Board preset for the Router Emulator.
; Keys other than name/description/ram/dump-dir are -M machine options.
; MediaTek MT7621A (MIPS 1004Kc): machine mt7621-router on qemu-system-mipsel.
; MT7530 ports: 1..4 = lan1..lan4; PHY 0 = wan, muxed through port 5 to
; GMAC1 (not a switch port).  SPI-NOR 16 MB, stock Cudy U-Boot 1.1.3.
; Not in OpenWrt yet (PR openwrt/openwrt#22365): the OpenWrt 25.12.5 build
; for it goes into the flash folder (tools/prepare-nand.sh --soc mt7621 --nor
; --stock DIR cudy_wr1300s, DIR with the u-boot / factory dumps and the
; sysupgrade.bin).
[preset]
name=Cudy WR1300S
description=MT7621A, 5x1G (WAN on GMAC1 + 4 LAN on the MT7530), DDR3 128 MB, SPI-NOR 16 MB, stock Cudy U-Boot 1.1.3, USB 3.0, Wi-Fi MT7603E 2.4 GHz + MT7663E (MT7613BE) 5 GHz on PCIe (radio silent)
soc=mt7621
ports=wan:lan1:lan2:lan3:lan4
ddr=ddr3
ram=128
flash-type=nor
flash-id=ef4018
usb-port=3
reset-gpio=10
wps-gpio=12
pcie0=mt7603e
pcie1=mt7663e
dump-dir=nor-wr1300s
openwrt=cudy_wr1300s
openwrt-stock=cudy-wr1300s
openwrt-nor=1
; LEDs (from mt7621_cudy_wr1300s.dts of PR openwrt/openwrt#22365)
led1=Status: blue gpio:18 + red gpio:15:low
led2=Internet: blue gpio:13:low
led3=WAN: blue gpio:16:low
led4=LAN: blue gpio:4:low
led5=2.4 GHz: blue gpio:3:low
led6=5 GHz: blue gpio:8:low
