; Board preset for the Router Emulator.
; Keys other than name/description/ram/dump-dir are -M machine options.
; LAN: Airoha AN8855 switch (MDIO 1) ports 0..2 = lan1..lan3,
; WAN: MT7987 internal 2.5G PHY (MDIO 15) on GMAC1.
[preset]
name=Routerich BE7200
description=MT7987A, 2.5G WAN internal PHY on GMAC1, 3x1G LAN AN8855, DDR4 1 GB, NAND 512 MB, USB 3.0, Wi-Fi 7 MT7992 on PCIe
soc=mt7987
gmac0=an8855
ports=lan1:lan2:lan3:-:-
gmac1=i2p5ge
gmac1-phy-addr=15
gmac1-port=wan
flash-type=nand
flash-id=efaa23
ddr=ddr4
ram=1024
usb-port=3
pcie-wifi=mt7992
reset-gpio=1
; mesh button
wps-gpio=0
dump-dir=nand-routerich-be7200
openwrt=routerich_be7200
; flash layout: BL2, u-boot-env (stock), Factory 4 MB, FIP, ubi (fit + U-Boot env)
openwrt-parts=BL2:0x100000,u-boot-env:0x80000,Factory:0x400000,FIP:0x200000,ubi:-
; LEDs (tools/dts-leds.py from mt7987a-routerich-be7200.dts)
led1=Status: blue gpio:4:low
led2=Wi-Fi 5G: blue gpio:5:low
led3=Mesh: blue gpio:7:low
led4=WAN: red gpio:8 + blue gpio:9:low
led5=LAN 3: blue gpio:10:low
led6=LAN 2: blue gpio:11:low
led7=LAN 1: blue gpio:12:low
