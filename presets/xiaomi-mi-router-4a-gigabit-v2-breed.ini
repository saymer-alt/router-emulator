; Board preset for the Router Emulator.
; Keys other than name/description/ram/nand-dir are -M machine options.
; MediaTek MT7621A (MIPS 1004Kc): machine mt7621-router on qemu-system-mipsel.
; MT7530 ports: 1 = lan1, 2 = lan2, 3 = wan.
; The 4A Gigabit v2 with its flash replaced by a 32 MB SPI-NOR and Breed
; 1.1 (r1337) as bootloader (tools/prepare-nand.sh --soc mt7621 --nor
; --nor-mb 32 --stock DIR --parts <openwrt-parts>
; xiaomi_mi-router-4a-gigabit-v2, DIR with the Breed / factory dumps and
; Breed's settings).  OpenWrt has no 32 MB image of the board:
; prepare-nand builds the release with its ImageBuilder, the kernel's
; device tree changed to the 32 MB layout (firmware 0x180000-0x2000000,
; no Config): tools/ib-flash-size.py --mb 32.
[preset]
name=Xiaomi Mi Router 4A Gigabit Edition v2 (32 MB, Breed)
description=MT7621A, 3x1G MT7530 (WAN = port 3), DDR3 128 MB, SPI-NOR 32 MB (W25Q256JV, replaced chip), Breed 1.1 bootloader, no USB, Wi-Fi MT7603E 2.4 GHz + MT7663E (MT7613BE) 5 GHz on PCIe (radio silent)
soc=mt7621
ports=-:lan1:lan2:wan:-
ddr=ddr3
ram=128
nor=32
usb-port=none
reset-gpio=18
pcie0=mt7603e
pcie1=mt7663e
nand-dir=nor-mi-router-4a-gigabit-v2-breed
openwrt=xiaomi_mi-router-4a-gigabit-v2
openwrt-stock=xiaomi-mi-router-4a-gigabit-v2-breed
openwrt-nor=1
openwrt-parts=u-boot:0x30000,u-boot-env:0x10000,Bdata:0x10000,factory:0x10000,crash:0x10000,cfg_bak:0x10000,overlay:0x100000,firmware:0x1e80000
; LEDs (tools/dts-leds.py from mt7621_xiaomi_mi-router-4a-gigabit-v2.dts)
led1=Status: yellow gpio:15:low + blue gpio:13:low
led2=WAN: blue gpio:14:low + yellow gpio:16:low
