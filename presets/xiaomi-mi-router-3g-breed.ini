; Board preset for the Router Emulator.
; Keys other than name/description/ram/dump-dir are -M machine options.
; MediaTek MT7621A (MIPS 1004Kc): machine mt7621-router on qemu-system-mipsel.
; MT7530 ports: 1 = wan, 2 = lan2, 3 = lan1.  Parallel NAND (flash-type=parallel-nand).
[preset]
name=Xiaomi Mi Router 3G (Breed)
description=MT7621A, 3x1G MT7530 (WAN + 2 LAN), DDR3 256 MB, NAND 128 MB, Breed 1.2 bootloader, USB 3.0, Wi-Fi MT7603E 2.4 GHz + MT7612E 5 GHz on PCIe (radio silent)
soc=mt7621
flash-type=parallel-nand
flash-id=c2f18095
ports=-:wan:lan2:lan1:-
ddr=ddr3
ram=256
usb-port=3
reset-gpio=18
pcie0=mt7603e
pcie1=mt7612e
dump-dir=nand-mi-router-3g-breed
openwrt=xiaomi_mi-router-3g
openwrt-stock=xiaomi-mi-router-3g-breed
; LEDs (tools/dts-leds.py from mt7621_xiaomi_mi-router-3g.dts)
led1=Status: yellow gpio:10:low + blue gpio:8:low + red gpio:6:low
led2=WAN: amber gpio:13:low
led3=LAN 1: amber gpio:14:low
led4=LAN 2: amber gpio:16:low
