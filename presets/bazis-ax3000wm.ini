; Board preset for the Router Emulator.
; Keys other than name/description/ram/dump-dir are -M machine options.
; Bazis AX3000WM = Shenzhen Jia Yan Technology WD-R3000N-G2A (same board).
; WAN: MaxLinear GPY211C on GMAC0 (MDIO 5, reset on GPIO 14 = MDIO bus
; reset); LAN: MT7981 built-in PHY on GMAC1.
[preset]
name=Bazis AX3000WM / WD-R3000N-G2A
description=2.5G WAN GPY211 on GMAC0, 1G LAN built-in PHY on GMAC1 (no switch), DDR3 256 MB, NAND 128 MB, USB 3.0
gmac0=gpy211
gmac0-phy-addr=5
gmac0-port=wan
gmac0-reset-gpio=14
gmac1=gphy
gmac1-port=lan1
flash-type=nand
flash-id=efaa21
ddr=ddr3
ram=256
usb-port=3
reset-gpio=1
; mesh button
wps-gpio=0
dump-dir=nand-ax3000wm
openwrt=bazis_ax3000wm
openwrt-no-bdinfo=1
; LEDs (tools/dts-leds.py from mt7981b-bazis-ax3000wm.dts)
led1=Power: blue gpio:13:low + red gpio:34:low
led2=WAN: green phy:5:2 + amber phy:5:3
led3=Wi-Fi 2.4G: blue gpio:4:low
led4=Internet: blue gpio:8:low
led5=Wi-Fi 5G: green gpio:35:low
led6=LAN: green gpio:6:low
