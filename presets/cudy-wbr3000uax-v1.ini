; Board preset for the Router Emulator.
; Keys other than name/description/ram/dump-dir are -M machine options.
[preset]
name=Cudy WBR3000UAX v1 (U-Boot layout)
description=5x1G MT7531 (WAN = port 0), DDR3 512 MB, NAND 128 MB, USB 3.0
gmac0=mt7531
ports=wan:lan1:lan2:lan3:lan4
gmac1=none
flash-type=nand
flash-id=efaa21
ddr=ddr3
ram=512
usb-port=3
reset-gpio=1
wps-gpio=0
dump-dir=nand-wbr3000uax
openwrt=cudy_wbr3000uax-v1
; LEDs (tools/dts-leds.py from mt7981b-cudy-wbr3000uax-v1.dts)
led1=Power: blue gpio:8:low + red gpio:4:low
led2=Internet: blue gpio:10:low
led3=WAN: blue gpio:11:low
led4=LAN: blue gpio:9:low
led5=WPS: red gpio:5:low
led6=Wi-Fi 2.4G: blue gpio:6:low
led7=Wi-Fi 5G: blue gpio:7:low
