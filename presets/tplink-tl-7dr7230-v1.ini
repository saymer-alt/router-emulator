; Board preset for the Router Emulator.
; Keys other than name/description/ram/dump-dir are -M machine options.
; MT7988D (Filogic 860): built-in switch ports 0..3 = lan4..lan1, WAN:
; internal 2.5G PHY.  The Wi-Fi card is not emulated.
; OpenWrt supports this board only in snapshot builds (not in 25.12.5): the
; flash folder is built from snapshot images.
[preset]
name=TP-Link TL-7DR7230 v1
description=MT7988D (Filogic 860), 2.5G WAN internal PHY on GMAC1, 4x1G LAN built-in switch, DDR4 512 MB, NAND 128 MB (OpenWrt snapshot: no LuCI)
soc=mt7988
gmac0=mt7988-switch
ports=lan4:lan3:lan2:lan1:-
gmac1=i2p5ge
gmac1-phy-addr=15
gmac1-port=wan
flash-type=nand
flash-id=efaa21
ddr=ddr4
ram=512
usb-port=none
reset-gpio=13
wps-gpio=14
dump-dir=nand-tl-7dr7230
openwrt=tplink_tl-7dr7230-v1
openwrt-version=snapshot
; TP-Link layout: bl2, (u-boot-env), factory 0x180000, config 0x360000, fip 0x580000, ubi 0x780000
openwrt-parts=BL2:0x100000,u-boot-env:0x80000,Factory:0xa0000,reserved:0x140000,config:0x20000,reserved2:0x200000,FIP:0x200000,ubi:-
; LEDs (tools/dts-leds.py from mt7988d-tplink-tl-7dr7230-v1.dts)
led1=Status: green gpio:54 + red gpio:53
led2=LAN 4: green swphy:0:0
led3=LAN 3: green swphy:1:0
led4=LAN 2: green swphy:2:0
led5=LAN 1: green swphy:3:0
led6=WAN: green phy:15:0
