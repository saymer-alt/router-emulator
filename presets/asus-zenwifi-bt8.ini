; Board preset for the Router Emulator.
; Keys other than name/description/ram/dump-dir are -M machine options.
; MT7988D: built-in switch ports 1, 2 = lan2, lan1; WAN: internal 2.5G PHY.
; lan3 (GMAC2, 2.5G PHY at MDIO 5) and the MT7996 Wi-Fi card are not
; emulated.
[preset]
name=Asus ZenWiFi BT8 (U-Boot layout)
description=MT7988D (Filogic 860), 2.5G WAN internal PHY on GMAC1, 2x1G LAN built-in switch, DDR4 1 GB, NAND 128 MB, USB 3.0
soc=mt7988
gmac0=mt7988-switch
; built-in switch: port 1 = lan2, port 2 = lan1 (ports 0, 3 unused)
ports=-:lan2:lan1:-:-
gmac1=i2p5ge
gmac1-phy-addr=15
gmac1-port=wan
flash-type=nand
flash-id=efaa21
ddr=ddr4
ram=1024
usb-port=3
reset-gpio=13
wps-gpio=14
dump-dir=nand-zenwifi-bt8
openwrt=asus_zenwifi-bt8
; SPI-NAND layout: BL2 at 0, UBI from 0x200000 with the FIP as volume "fip"
openwrt-ubi-fip=1
openwrt-ubi-factory=0x200000
; LEDs (tools/dts-leds.py from mt7988d-asus-zenwifi-bt8.dts)
led1=Status: green pwm:1 + red pwm:0 + blue pwm:3
