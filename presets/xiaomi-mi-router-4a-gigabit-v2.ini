; Board preset for the Router Emulator.
; Keys other than name/description/ram/nand-dir are -M machine options.
; MediaTek MT7621A (MIPS 1004Kc): machine mt7621-router on qemu-system-mipsel.
; MT7530 ports: 1 = lan1, 2 = lan2, 3 = wan.
; SPI-NOR 16 MB, stock Xiaomi U-Boot 2018.09 (tools/prepare-nand.sh --soc
; mt7621 --nor --stock DIR --parts <openwrt-parts> xiaomi_mi-router-4a-gigabit-v2,
; DIR with the u-boot / factory dumps).
[preset]
name=Xiaomi Mi Router 4A Gigabit Edition v2
description=MT7621A, 3x1G MT7530 (WAN = port 3), DDR3 128 MB, SPI-NOR 16 MB, stock Xiaomi U-Boot 2018.09, no USB, Wi-Fi MT7603E 2.4 GHz + MT7663E (MT7613BE) 5 GHz on PCIe (radio silent)
soc=mt7621
ports=-:lan1:lan2:wan:-
ddr=ddr3
ram=128
usb-port=none
reset-gpio=18
pcie0=mt7603e
pcie1=mt7663e
nand-dir=nor-mi-router-4a-gigabit-v2
openwrt=xiaomi_mi-router-4a-gigabit-v2
openwrt-stock=xiaomi-mi-router-4a-gigabit-v2
openwrt-nor=1
openwrt-parts=u-boot:0x30000,u-boot-env:0x10000,Bdata:0x10000,factory:0x10000,crash:0x10000,cfg_bak:0x10000,overlay:0x100000,firmware:0xe70000,Config:0x10000
; LEDs (tools/dts-leds.py from mt7621_xiaomi_mi-router-4a-gigabit-v2.dts)
led1=Status: yellow gpio:15:low + blue gpio:13:low
led2=WAN: blue gpio:14:low + yellow gpio:16:low
