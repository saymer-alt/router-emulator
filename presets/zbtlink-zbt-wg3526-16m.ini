; Board preset for the Router Emulator.
; Keys other than name/description/ram/dump-dir are -M machine options.
; MediaTek MT7621A (MIPS 1004Kc): machine mt7621-router on qemu-system-mipsel.
; MT7530 ports 0..3 = lan1..lan4, port 4 = wan.
[preset]
name=Zbtlink ZBT-WG3526 (16M)
description=MT7621A, 5x1G MT7530 (WAN = port 4), DDR3 512 MB, SPI-NOR 16 MB (OpenWrt U-Boot), USB 3.0, Wi-Fi MT7603E 2.4 GHz + MT7612E 5 GHz on PCIe (radio silent); SD not emulated
soc=mt7621
ports=lan1:lan2:lan3:lan4:wan
ddr=ddr3
ram=512
flash-type=nor
flash-id=ef4018
usb-port=3
reset-gpio=18
pcie0=mt7603e
pcie1=mt7612e
dump-dir=nor-zbt-wg3526-16m
openwrt=zbtlink_zbt-wg3526-16m
; LEDs (tools/dts-leds.py from mt7621_zbtlink_zbt-wg3526-16m.dts)
led1=Status: green gpio:24:low
