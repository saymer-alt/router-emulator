; Board preset for the Router Emulator.
; Keys other than name/description/ram/dump-dir are -M machine options.
; LAN: MT7531 ports 0..3 = lan1..lan4, WAN: built-in PHY on GMAC1.
; The SFP cage (MT7531 port 5) is not emulated.
[preset]
name=Keenetic KN-1012
description=1G WAN built-in PHY on GMAC1, 4x1G LAN MT7531, DDR4 512 MB, NAND 256 MB (stock bootloader, NMBM), USB 3.0
gmac0=mt7531
ports=lan1:lan2:lan3:lan4:-
gmac1=gphy
gmac1-port=wan
flash-type=nand
flash-id=efaa22
ddr=ddr4
ram=512
usb-port=3
reset-gpio=1
wps-gpio=0
dump-dir=nand-kn1012
