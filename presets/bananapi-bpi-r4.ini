; Board preset for the Router Emulator.
; Keys other than name/description/ram/dump-dir are -M machine options.
; MT7988A (Filogic 880): built-in switch ports 0..3 = wan, lan1..lan3.
; The two 10G SFP+ cages (GMAC1, GMAC2) and the Wi-Fi card are not
; emulated; the real board has 4 GB (emulated: 2 GB).
[preset]
name=Bananapi BPi-R4
description=MT7988A (Filogic 880), WAN + 3x1G LAN built-in switch, DDR4 2 GB, eMMC, USB 3.0
soc=mt7988
gmac0=mt7988-switch
ports=wan:lan1:lan2:lan3:-
gmac1=none
flash-type=emmc
ddr=ddr4
ram=2048
usb-port=3
; the "WPS" button is the reset key (KEY_RESTART)
reset-gpio=14
wps-gpio=13
dump-dir=emmc-bpi-r4
openwrt=bananapi_bpi-r4
openwrt-emmc=1
openwrt-emmc-layout=bpi-r4
; LEDs (tools/dts-leds.py from mt7988a-bananapi-bpi-r4.dts)
led1=WAN: green swphy:0:0
led2=LAN 1: green swphy:1:0
led3=LAN 2: green swphy:2:0
led4=LAN 3: green swphy:3:0
led5=Status: green gpio:79
led6=WPS: blue gpio:63
