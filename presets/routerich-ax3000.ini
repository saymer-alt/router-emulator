; Board preset for the Router Emulator.
; Keys other than name/description/ram/dump-dir are -M machine options.
; MT7531 ports 0, 2, 3 = lan1..lan3, port 4 = wan (port 1 unused).
; OpenWrt U-Boot layout (routerich_ax3000-ubootmod images).
[preset]
name=Routerich AX3000 (U-Boot layout)
description=WAN + 3x1G LAN MT7531, DDR3 256 MB, NAND 128 MB, USB 2.0
gmac0=mt7531
ports=lan1:-:lan2:lan3:wan
gmac1=none
flash-type=nand
flash-id=efaa21
ddr=ddr3
ram=256
usb-port=2
reset-gpio=1
; mesh button
wps-gpio=0
dump-dir=nand-routerich-ax3000
openwrt=routerich_ax3000
; Routerich flash layout: no bdinfo, FIP at 0x380000, ubi at 0x580000
openwrt-no-bdinfo=1
; LEDs (tools/dts-leds.py from mt7981b-routerich-ax3000.dts)
led1=Wi-Fi 5G: red gpio:5:low
led2=WAN: red gpio:6 + blue gpio:12:low
led3=Power: blue gpio:7:low
led4=LAN 1: blue gpio:9:low
led5=LAN 2: blue gpio:10:low
led6=LAN 3: blue gpio:11:low
led7=Wi-Fi 2.4G: blue gpio:34:low
led8=Mesh: blue gpio:35:low
