; Board preset for the Router Emulator.
; Keys other than name/description/ram/dump-dir are -M machine options.
; MT7531 ports 1..3 = lan1..lan3, WAN: built-in PHY on GMAC1.
; Vendor bootloader layout (OpenWrt builds no U-Boot for it): the flash
; folder needs dumps of your own router (BL2, FIP), see README.
[preset]
name=Routerich AX3000 v1
description=1G WAN built-in PHY on GMAC1, 3x1G LAN MT7531, DDR3 512 MB, NAND 128 MB (stock bootloader), USB 3.0
gmac0=mt7531
ports=-:lan1:lan2:lan3:-
gmac1=gphy
gmac1-port=wan
flash-type=nand
flash-id=efaa21
ddr=ddr3
ram=512
usb-port=3
reset-gpio=1
; mesh button
wps-gpio=0
dump-dir=nand-routerich-ax3000-v1
openwrt=routerich_ax3000-v1
; vendor BL2 / FIP dumps: Routerich AX3000 v1 (not in the repository)
openwrt-stock=routerich-ax3000-v1
openwrt-no-bdinfo=1
; LEDs (tools/dts-leds.py from mt7981b-routerich-ax3000-v1.dts)
led1=Wi-Fi 5G: red gpio:5:low
led2=WAN: red gpio:6 + blue gpio:12:low
led3=Power: blue gpio:7:low
led4=LAN 1: blue gpio:9:low
led5=LAN 2: blue gpio:10:low
led6=LAN 3: blue gpio:11:low
led7=Wi-Fi 2.4G: blue gpio:34:low
led8=Mesh: blue gpio:35:low
