; Board preset for the Router Emulator.
; Keys other than name/description/ram/dump-dir are -M machine options.
; MediaTek MT7621A (MIPS 1004Kc): machine mt7621-router on qemu-system-mipsel.
; MT7530 port 3 = lan; PHY 4 = wan, muxed to GMAC1 (not a switch port).
; SPI-NOR 16 MB, stock Cudy U-Boot 1.1.3 (tools/prepare-nand.sh --soc mt7621
; --nor --stock DIR cudy_m1300-v2, DIR with the u-boot / factory dumps).
; NOR: XMC XM25QH128D (RDID 20 40 18, as the XM25QH128C).  The stock Cudy
; firmware checks the chip's unique ID against bdinfo (no admin password
; otherwise): add -o flash-uid=<16 digits after the '-' of the router's
; /proc/sys/dev/flash_uuid> with a dump of your own router's flash.
[preset]
name=Cudy M1300 v2
description=MT7621A, 2x1G (WAN on GMAC1 + 1 LAN on the MT7530), DDR3 128 MB, SPI-NOR 16 MB (XMC XM25QH128D), stock Cudy U-Boot 1.1.3, Wi-Fi MT7603E 2.4 GHz + MT7663E (MT7613BE) 5 GHz on PCIe (radio silent)
soc=mt7621
ports=-:-:-:lan1:wan
ddr=ddr3
ram=128
flash-type=nor
flash-id=204018
usb-port=none
reset-gpio=8
wps-gpio=10
pcie0=mt7603e
pcie1=mt7663e
dump-dir=nor-m1300-v2
openwrt=cudy_m1300-v2
openwrt-stock=cudy-m1300-v2
openwrt-nor=1
; LEDs (tools/dts-leds.py from mt7621_cudy_m1300-v2.dts)
led1=Status: white gpio:4:low + red gpio:3:low
