name: "Ошибка / Bug report"
description: "Сообщить о воспроизводимой ошибке"
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        **Перед отправкой:** не прикладывайте пароли, закрытые ключи, токены, подписки, VPN-ключи, приватные IP-конфигурации (VPN-ключи, конфигурации Netfilter). Логи и диагностику предварительно обезличивайте. Уязвимости не публикуйте в открытом Issue — используйте приватный канал из [SECURITY.md](../../blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: "Что происходит?"
      description: "Ожидаемое поведение и фактическое поведение."
      placeholder: "Ожидалось ...; фактически ..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Действия для воспроизведения"
      description: "Минимальные шаги без секретов."
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: "Версия"
      description: "Версия приложения, скрипта или конкретный коммит."
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: "Окружение"
      description: "Пресет эмулируемого устройства (например Cudy WR3000P / MT7981), тип гостевой прошивки (Ported / OpenWrt), версия QEMU и применённые патчи, ОС хоста (Linux/WSL)."
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: "Диагностика и логи"
      description: "Обезличенные логи, отчёты, скриншоты — только необходимое."
    validations:
      required: false
  - type: checkboxes
    id: secrets
    attributes:
      label: "Безопасность"
      options:
        - label: "Я удалил(а) из отчёта пароли, токены, ключи, подписки и приватные адреса."
          required: true
