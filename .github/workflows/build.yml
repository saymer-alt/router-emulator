# Build, test and (on a tag) release the emulator.
#
#   push / pull request   (not when only *.md files changed)
#                         build both packages, boot the test presets
#                         (TEST_PRESETS) with each on Linux and real Windows,
#                         keep the packages as workflow artifacts
#   VERSION changed       push to main with a VERSION that has no tag
#                         v<VERSION> yet (or a push of that tag): the same
#                         with PGO, then publish the packages as GitHub
#                         Release v<VERSION> (the tag is created on the
#                         pushed commit)
#   VERSION X.Y           binary release: the packages + the presets archive
#   VERSION X.Y.Z         presets-only release (only presets/ changed since
#                         X.Y): the presets archive alone; no package
#                         builds and no boot tests; it is unpacked over the
#                         X.Y packages
#
# Packages (no flash folders and no presets, as in the published releases;
# every release also gets Router-Emulator-<version>-presets.zip,
# tools/package-presets.sh):
#   Router-Emulator-<version>-linux-x86_64.tar.gz   tools/package-linux.sh
#   Router-Emulator-<version>-win64.zip             build-windows.sh
# The Windows package is cross-built on Linux exactly as build-windows.sh
# does it locally (QEMU's Fedora MinGW image + clang, Mono C# compiler,
# PGO under Wine for tags); the windows-latest job then boots OpenWrt with
# the packaged qemu-system-aarch64.exe on real Windows.
name: Build/release

on:
  push:
    paths-ignore: ['**.md', 'lab/**', '.github/workflows/keenetic-lab.yml']
  pull_request:
    paths-ignore: ['**.md', 'lab/**', '.github/workflows/keenetic-lab.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  OPENWRT: 25.12.5
  # boot tests: one preset per distinct hardware combination that official
  # OpenWrt images exist for (NOR boards, vendor bootloaders and own builds
  # need private dumps):
  #   cudy-wr3000p-v1  DDR4, RTL8221B on GMAC1, 4 LAN on the MT7531, USB 2.0
  #   cudy-wr3000h-v1  the same with a DDR3 preloader
  #   cudy-wr3000s-v1  WAN on a switch port
  #   cudy-tr3000-v1   no switch: RTL8221B on GMAC0, 1 LAN on the built-in PHY, USB 3.0
  #   netis-nx31       flash layout without bdinfo, WAN on the built-in PHY
  #   xiaomi-redmi-ax6000  MT7986, DDR4, WAN on a switch port
  #   netcore-n60      MT7986, DDR3, RTL8221B on GMAC1
  #   netcore-n60-pro  MT7986, GPY211 on GMAC1 and on switch port 5, USB 3.0
  #   glinet-gl-mt6000 MT7986, eMMC
  #   huasifei-wh3000-pro-emmc  MT7981, eMMC in the vendor layout (OpenWrt
  #                    U-Boot of another board), RTL8221B on GMAC0
  #   bananapi-bpi-r4-lite  MT7987, NAND on SPI2 with the FIP in UBI,
  #                    internal 2.5G PHY
  #   routerich-be7200 MT7987, Airoha AN8855 switch, 512 MB NAND, own layout
  #   asus-zenwifi-bt8 MT7988D (Filogic 860), built-in switch, NAND with
  #                    the FIP and Factory in UBI
  #   bananapi-bpi-r4  MT7988A (Filogic 880), built-in switch, eMMC
  #   teltonika-rutc50 SPI-NOR boot + SPI-NAND (nor-nand), own U-Boot
  #                    (tools/uboot-rutc50), 74HC595 LEDs on SPI1
  #   openwrt-one      SPI-NAND boot + SPI-NOR recovery (nor-nand)
  #   zbtlink-zbt-wg3526-16m  MT7621A (MIPS, qemu-system-mipsel), SPI-NOR,
  #                    OpenWrt U-Boot (TPL/SPL, DDR init blob), MT7530
  TEST_PRESETS: >-
    cudy-wr3000p-v1 cudy-wr3000h-v1 cudy-wr3000s-v1 cudy-tr3000-v1 netis-nx31
    xiaomi-redmi-ax6000 netcore-n60 netcore-n60-pro glinet-gl-mt6000
    huasifei-wh3000-pro-emmc bananapi-bpi-r4-lite routerich-be7200
    asus-zenwifi-bt8 bananapi-bpi-r4 teltonika-rutc50 openwrt-one
    zbtlink-zbt-wg3526-16m

jobs:
  # release or not: VERSION without its tag on main, or the tag itself;
  # binary (X.Y) or presets-only (X.Y.Z)
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
      presets-only: ${{ steps.v.outputs.presets-only }}
      pgo: ${{ steps.v.outputs.pgo }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          V=$(tr -d ' \r\n' < VERSION)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          rel=false
          if [ "$GITHUB_REF" = "refs/tags/v$V" ]; then
            rel=true
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ] &&
               ! git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
            rel=true
          fi
          echo "release=$rel" >> "$GITHUB_OUTPUT"
          case $V in
            *.*.*) po=true ;;
            *) po=false ;;
          esac
          echo "presets-only=$po" >> "$GITHUB_OUTPUT"
          # PGO only for the packages of a binary release
          pgo=false; [ $rel = true ] && [ $po = false ] && pgo=true
          echo "pgo=$pgo" >> "$GITHUB_OUTPUT"
          echo "VERSION $V, release: $rel, presets only: $po"

  build:
    needs: version
    if: needs.version.outputs.presets-only != 'true'
    # linux-aarch64 builds natively on an Arm runner
    runs-on: ${{ matrix.target == 'linux-aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 120
    strategy:
      # let one package finish even when the other one fails
      fail-fast: false
      matrix:
        target: [linux, linux-aarch64, win64]
    steps:
      - uses: actions/checkout@v7

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git ninja-build meson \
            pkg-config python3 python3-venv libglib2.0-dev libpixman-1-dev \
            libslirp-dev libfdt-dev libusb-1.0-0-dev zlib1g-dev mtd-utils \
            wget socat curl patchelf zip
          if [ "${{ matrix.target }}" = linux-aarch64 ]; then sudo apt-get install -y bash-static; fi
          if [ "${{ matrix.target }}" = win64 ]; then
            sudo apt-get install -y mono-mcs mono-devel
            if [ "${{ needs.version.outputs.pgo }}" = true ]; then sudo apt-get install -y wine wine64; fi
          fi

      # --- Linux ---------------------------------------------------------
      - name: Build QEMU (no UI or audio, small dependency set)
        if: matrix.target != 'win64'
        env:
          CONFIGURE_ARGS: >-
            --disable-gtk --disable-sdl --disable-opengl --disable-vnc
            --disable-spice --disable-curl --audio-drv-list=
        run: ./build.sh

      - name: Machine is there
        if: matrix.target != 'win64'
        run: |
          src/qemu/build/qemu-system-aarch64 -M help | grep mt7981-router
          src/qemu/build/qemu-system-aarch64 -M help | grep mt7986-router
          src/qemu/build/qemu-system-aarch64 -M help | grep mt7987-router
          src/qemu/build/qemu-system-aarch64 -M mt7981-router,help
          src/qemu/build/qemu-system-mipsel -M help | grep mt7621-router

      - name: NAND image (official OpenWrt for cudy_wr3000p-v1)
        if: matrix.target != 'win64'
        run: tools/prepare-nand.sh cudy_wr3000p-v1 "$OPENWRT"

      # releases: QEMU rebuilt with profile-guided optimisation, trained
      # natively on this flash folder (tools/pgo-train.py); the boot tests
      # below then run the optimised binary
      - name: QEMU with PGO (releases)
        if: matrix.target != 'win64' && needs.version.outputs.pgo == 'true'
        env:
          CONFIGURE_ARGS: >-
            --disable-gtk --disable-sdl --disable-opengl --disable-vnc
            --disable-spice --disable-curl --audio-drv-list=
        run: PGO_NAND=nand-wr3000p ./build.sh

      - name: Boot to the console (BL2, U-Boot, kernel, procd)
        if: matrix.target != 'win64'
        run: |
          mkdir -p work
          python3 tests/quick.py --limit 600 -P cudy-wr3000p-v1 \
            --qemu="-netdev user,id=wan,restrict=on" \
            'BL2: @60' 'U-Boot 20@120' 'Starting kernel@240' \
            'Linux version@60' 'Please press Enter@480'

      - name: Headless run, LuCI through the LAN forward
        if: matrix.target != 'win64'
        run: |
          ./emulator.sh -P cudy-wr3000p-v1 -w offline -l user -u none \
            -S work/console.sock -L work/logs > work/run.log 2>&1 &
          # LuCI answers its login page with 403 until one logs in
          for i in $(seq 120); do
            code=$(curl -s -m 5 -o work/index.html -w '%{http_code}' \
              http://127.0.0.1:8080/cgi-bin/luci/ || true)
            case $code in 200|403) grep -q luci-static work/index.html && break ;; esac
            sleep 5
          done
          echo "HTTP $code"
          grep -q luci-static work/index.html
          echo quit | socat - UNIX-CONNECT:work/monitor.sock || true
          wait

      - name: Linux package
        if: matrix.target != 'win64'
        run: |
          # aarch64: glibc and a static bash in the package (TV boxes, CoreELEC)
          if [ "${{ matrix.target }}" = linux-aarch64 ]; then export BASH_STATIC=/bin/bash-static; fi
          tools/package-linux.sh

      # --- Windows (cross-built on Linux) --------------------------------
      - name: Windows package
        if: matrix.target == 'win64'
        run: |
          # profile-guided optimisation (trained under Wine) for releases
          if [ "${{ needs.version.outputs.pgo }}" = true ]; then export PGO=1; else export PGO=0; fi
          # flash folders are not packaged; PGO trains on the WR3000P one
          FLASH_PRESETS=cudy-wr3000p-v1 VERSION="$OPENWRT" ./build-windows.sh

      # --- results -------------------------------------------------------
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.target }}
          path: |
            dist/*-linux-*.tar.gz
            dist/*-win64.zip
          if-no-files-found: error

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.target }}
          path: |
            work/*.log
            work/logs/
          if-no-files-found: ignore

  # flash folders of the test presets, from the official OpenWrt images
  flash:
    needs: version
    if: needs.version.outputs.presets-only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y mtd-utils gdisk wget zip python3
      - name: Flash folders
        run: |
          mkdir -p work/flash
          for p in $TEST_PRESETS; do
            f=presets/$p.ini
            get() { awk -F= -v k="$1" '$1 == k { sub(/^[^=]*=/, ""); print; exit }' "$f"; }
            set -- --flash-mb "$(get nand)"
            [ "$(get openwrt-no-bdinfo)" = 1 ] && set -- "$@" --no-bdinfo
            [ -n "$(get soc)" ] && set -- "$@" --soc "$(get soc)"
            [ "$(get openwrt-emmc)" = 1 ] && set -- "$@" --emmc
            [ -n "$(get openwrt-emmc-layout)" ] && set -- "$@" --emmc-layout "$(get openwrt-emmc-layout)"
            [ -n "$(get openwrt-uboot)" ] && set -- "$@" --uboot "$(get openwrt-uboot)"
            [ "$(get openwrt-ubi-fip)" = 1 ] && set -- "$@" --ubi-fip
            [ -n "$(get openwrt-ubi-factory)" ] && set -- "$@" --ubi-factory "$(get openwrt-ubi-factory)"
            [ -n "$(get openwrt-parts)" ] && set -- "$@" --parts "$(get openwrt-parts)"
            [ -n "$(get openwrt-nor-nand)" ] && set -- "$@" --nor-nand "$(get openwrt-nor-nand)"
            ver=$(get openwrt-version)
            tools/prepare-nand.sh "$@" "$(get openwrt)" "${ver:-$OPENWRT}" "work/flash/$(get nand-dir)"
          done
          (cd work/flash && zip -qr1 "$GITHUB_WORKSPACE/ci-flash.zip" .)
      - uses: actions/upload-artifact@v7
        with:
          name: ci-flash
          path: ci-flash.zip
          retention-days: 3

  # every test preset boots from the Linux package
  test-linux:
    needs: [build, flash]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # wan: the WAN link as the kernel names it on that board; first:
        # the first boot stage's line (default BL2), qemu: the binary
        include:
          - { preset: cudy-wr3000p-v1, wan: 'wan: Link is Up' }
          - { preset: cudy-wr3000h-v1, wan: 'wan: Link is Up' }
          - { preset: cudy-wr3000s-v1, wan: 'wan: Link is Up' }
          - { preset: cudy-tr3000-v1, wan: 'eth0: Link is Up' }
          - { preset: netis-nx31, wan: 'eth1: Link is Up' }
          - { preset: xiaomi-redmi-ax6000, wan: 'wan: Link is Up' }
          - { preset: netcore-n60, wan: 'eth1: Link is Up' }
          - { preset: netcore-n60-pro, wan: 'eth1: Link is Up' }
          - { preset: glinet-gl-mt6000, wan: 'eth1: Link is Up' }
          - { preset: huasifei-wh3000-pro-emmc, wan: 'eth1: Link is Up' }
          - { preset: bananapi-bpi-r4-lite, wan: 'wan: Link is Up' }
          - { preset: routerich-be7200, wan: 'wan: Link is Up' }
          - { preset: asus-zenwifi-bt8, wan: 'wan: Link is Up' }
          - { preset: bananapi-bpi-r4, wan: 'wan: Link is Up' }
          - { preset: teltonika-rutc50, wan: 'wan: Link is Up' }
          - { preset: openwrt-one, wan: 'eth0: Link is Up' }
          - { preset: zbtlink-zbt-wg3526-16m, wan: 'wan: Link is Up', first: 'U-Boot SPL', qemu: qemu-system-mipsel }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: package-linux
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: ci-flash
          path: dist
      - name: Boot ${{ matrix.preset }} (console and WAN link)
        run: |
          mkdir -p pkg && tar -C pkg -xzf dist/*-linux-*.tar.gz
          cd pkg/Router-Emulator
          # presets are not packaged (Router-Emulator-<version>-presets.zip): from the tree
          cp -r "$GITHUB_WORKSPACE/presets" .
          unzip -q "$GITHUB_WORKSPACE/dist/ci-flash.zip" && mkdir -p work
          env -i PATH=/usr/bin:/bin python3 tests/quick.py --limit 900 \
            -P ${{ matrix.preset }} --qemu="-netdev user,id=wan,restrict=on" \
            '${{ matrix.first || 'BL2: ' }}@120' 'U-Boot 20@240' 'Please press Enter@600' \
            '${{ matrix.wan }}@180'
      - name: Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-linux-${{ matrix.preset }}
          path: pkg/Router-Emulator/work/
          if-no-files-found: ignore

  # and from the Windows package on real Windows
  windows-test:
    needs: [build, flash]
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # wan: the WAN link as the kernel names it on that board; first:
        # the first boot stage's line (default BL2), qemu: the binary
        include:
          - { preset: cudy-wr3000p-v1, wan: 'wan: Link is Up' }
          - { preset: cudy-wr3000h-v1, wan: 'wan: Link is Up' }
          - { preset: cudy-wr3000s-v1, wan: 'wan: Link is Up' }
          - { preset: cudy-tr3000-v1, wan: 'eth0: Link is Up' }
          - { preset: netis-nx31, wan: 'eth1: Link is Up' }
          - { preset: xiaomi-redmi-ax6000, wan: 'wan: Link is Up' }
          - { preset: netcore-n60, wan: 'eth1: Link is Up' }
          - { preset: netcore-n60-pro, wan: 'eth1: Link is Up' }
          - { preset: glinet-gl-mt6000, wan: 'eth1: Link is Up' }
          - { preset: huasifei-wh3000-pro-emmc, wan: 'eth1: Link is Up' }
          - { preset: bananapi-bpi-r4-lite, wan: 'wan: Link is Up' }
          - { preset: routerich-be7200, wan: 'wan: Link is Up' }
          - { preset: asus-zenwifi-bt8, wan: 'wan: Link is Up' }
          - { preset: bananapi-bpi-r4, wan: 'wan: Link is Up' }
          - { preset: teltonika-rutc50, wan: 'wan: Link is Up' }
          - { preset: openwrt-one, wan: 'eth0: Link is Up' }
          - { preset: zbtlink-zbt-wg3526-16m, wan: 'wan: Link is Up', first: 'U-Boot SPL', qemu: qemu-system-mipsel }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: package-win64
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: ci-flash
          path: dist

      - name: Unpack
        shell: pwsh
        run: |
          Expand-Archive (Get-ChildItem dist/*-win64.zip).FullName -DestinationPath pkg
          Expand-Archive dist/ci-flash.zip -DestinationPath pkg/Router-Emulator
          Get-ChildItem pkg/Router-Emulator

      - name: QEMU starts, launcher is there
        shell: pwsh
        run: |
          $q = "pkg/Router-Emulator/qemu/qemu-system-aarch64.exe"
          $m = & $q -M help | Select-String mt7981-router
          if (-not $m) { exit 1 }
          $m = & $q -M help | Select-String mt7986-router
          if (-not $m) { exit 1 }
          $m = & "pkg/Router-Emulator/qemu/qemu-system-mipsel.exe" -M help | Select-String mt7621-router
          if (-not $m) { exit 1 }
          if (-not (Test-Path pkg/Router-Emulator/emulator.exe)) { exit 1 }

      - name: Boot ${{ matrix.preset }} with the packaged QEMU
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force work | Out-Null
          $env:QEMU_BIN = (Resolve-Path pkg/Router-Emulator/qemu/${{ matrix.qemu || 'qemu-system-aarch64' }}.exe).Path
          $dir = (Select-String -Path presets/${{ matrix.preset }}.ini -Pattern '^nand-dir=(.*)$').Matches[0].Groups[1].Value
          python tests/quick.py --limit 1200 -P ${{ matrix.preset }} `
            -n "pkg/Router-Emulator/$dir" `
            --qemu="-netdev user,id=wan,restrict=on" `
            '${{ matrix.first || 'BL2: ' }}@120' 'U-Boot 20@240' 'Linux version@300' 'Please press Enter@600' `
            '${{ matrix.wan }}@300'
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-windows-${{ matrix.preset }}
          path: work/
          if-no-files-found: ignore

  release:
    # presets-only: build and the tests are skipped, only the archive is made
    if: >-
      !cancelled() && needs.version.outputs.release == 'true' &&
      (needs.version.outputs.presets-only == 'true' ||
       (needs.test-linux.result == 'success' && needs.windows-test.result == 'success'))
    needs: [version, build, test-linux, windows-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        if: needs.version.outputs.presets-only != 'true'
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      # the presets as their own archive, from the released commit
      - uses: actions/checkout@v7
        with:
          path: src
      - name: Presets archive
        run: |
          src/tools/package-presets.sh
          mkdir -p dist && mv src/dist/*-presets.zip dist/

      - name: Release text
        run: |
          V=${{ needs.version.outputs.version }}
          if [ "${{ needs.version.outputs.presets-only }}" = true ]; then
            cat > body.md <<EOF
          **Board presets only**, no new packages: unpack \`Router-Emulator-$V-presets.zip\`
          over the Router Emulator ${V%.*} package (Windows, Linux x86_64 or aarch64) of
          [release v${V%.*}](https://github.com/$GITHUB_REPOSITORY/releases/tag/v${V%.*}), replacing its \`presets\` folder.
          EOF
            echo "name=Router Emulator $V (presets)" >> "$GITHUB_ENV"
          else
            cat > body.md <<'EOF'
          Packages: `...-win64.zip` (Windows 10/11 x64, run `emulator.exe`) and
          `...-linux-x86_64.tar.gz` (run `./emulator.sh`), `...-linux-aarch64.tar.gz`
          (64-bit Arm Linux: Raspberry Pi 4/5, TV boxes with CoreELEC; also with a
          32-bit userland, run `./bash emulator.sh` where there is no bash).
          **Board presets are a separate archive**, `...-presets.zip`: unpack it over the
          package. **No flash images are included**: build them with `tools/prepare-nand.sh`
          (see README.md / README.ru.md), take ready ones from
          [Google Drive](https://drive.google.com/drive/folders/173WnINcit9_lMt86FjfKkGMqnZrCZ-Am)
          or [Yandex Disk](https://yadi.sk/d/Re-w1Nm1DBFhOw), or use dumps of a real router.
          EOF
            echo "name=Router Emulator $V" >> "$GITHUB_ENV"
          fi
          sed -i 's/^          //' body.md
          cat body.md

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.name }}
          generate_release_notes: true
          body_path: body.md
          files: |
            dist/*-linux-*.tar.gz
            dist/*-win64.zip
            dist/*-presets.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
