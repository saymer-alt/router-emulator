name: KNVR report diagnostic
on:
  pull_request:
    paths: ['.github/workflows/knvr-e2e.yml']
permissions:
  contents: read
  actions: read
jobs:
  read-report:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: knvr-gates
          run-id: 40450698760
          repository: saymer-alt/router-emulator
          github-token: ${{ github.token }}
          path: report
      - name: Read existing sanitized report only
        run: cat report/knvr.json
