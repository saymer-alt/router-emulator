name: KNVR native Entware virtual acceptance
on: [pull_request]
permissions:
  contents: read
jobs:
  package-metadata:
    runs-on: ubuntu-24.04
    steps:
      - name: Read official Entware timestamp tool metadata
        run: |
          curl -fLsS --retry 3 https://bin.entware.net/aarch64-k3.10/Packages -o /tmp/entware-packages
          python3 - <<'PY'
          from pathlib import Path
          for entry in Path('/tmp/entware-packages').read_text().split('\n\n'):
              if entry.startswith('Package: coreutils-touch\n'):
                  print(entry)
                  break
          else:
              raise SystemExit('coreutils-touch missing')
          PY
