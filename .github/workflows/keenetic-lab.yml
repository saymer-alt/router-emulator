# Independent laboratory CI. Does not validate or install KeeneticOS.
# Only changes to lab/ and this file trigger heavy tests on PRs.
name: Keenetic lab - isolated QEMU regression

on:
  pull_request:
    paths:
      - "lab/**"
      - "qemu-patches/**"
      - "emulator.sh"
      - "presets/cudy-wr3000p-v1.ini"
      - ".github/workflows/keenetic-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness-unit:
    name: Lab runner tests (no guest firmware)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax and unit tests
        run: |
          python3 -m py_compile lab/run.py lab/test_runner.py
          python3 -m unittest discover -s lab -p 'test*.py' -v

  openwrt-boot-reset:
    name: QEMU MT7981 - OpenWrt cold boot and reset
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      EMU_VERSION: "4.1"
      OPENWRT_VERSION: "25.12.5"
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mtd-utils unzip socat curl wget python3 build-essential ninja-build meson pkg-config libglib2.0-dev libpixman-1-dev zlib1g-dev libslirp-dev libfdt-dev python3-venv

      - name: Download checked 4.1 flash preparation seed (no private firmware)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qemu-lab"
          cd "$RUNNER_TEMP/qemu-lab"
          base="https://github.com/stavultras/router-emulator/releases/download/v$EMU_VERSION"
          curl --retry 3 -fL -o emulator.tar.gz "$base/Router-Emulator-$EMU_VERSION-linux-x86_64.tar.gz"
          curl --retry 3 -fL -o presets.zip "$base/Router-Emulator-$EMU_VERSION-presets.zip"
          echo '8ae277cc0fecfb99da3a452fb4226f272ee6d571f362898ca2176513f3adb0b7  emulator.tar.gz' | sha256sum -c -
          echo '8146b505a9d75407c4504bf90638d7e3d3e3ccfc529d09c45a40b2b6868604a2  presets.zip' | sha256sum -c -
          tar -xzf emulator.tar.gz
          unzip -q presets.zip
          echo "EMU_ROOT=$RUNNER_TEMP/qemu-lab/Router-Emulator" >> "$GITHUB_ENV"

      - name: Prepare official OpenWrt flash
        run: |
          set -euo pipefail
          cd "$EMU_ROOT"
          tools/prepare-nand.sh cudy_wr3000p-v1 "$OPENWRT_VERSION"

      - name: Cache QEMU built from this checkout's patch series
        id: qemu-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/ported-qemu/qemu-system-aarch64
            ${{ runner.temp }}/ported-qemu/qemu.sha256
          key: ported-qemu-ubuntu24-v10.1.0-${{ hashFiles('qemu-patches/*.patch', 'lab/build_qemu.sh') }}

      - name: Build current patched QEMU
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        run: bash lab/build_qemu.sh "$RUNNER_TEMP/ported-qemu"

      - name: Install current QEMU, launcher and preset
        run: |
          (cd "$RUNNER_TEMP/ported-qemu" && sha256sum -c qemu.sha256)
          install -m 755 "$RUNNER_TEMP/ported-qemu/qemu-system-aarch64" "$EMU_ROOT/qemu/qemu-system-aarch64"
          install -m 755 emulator.sh "$EMU_ROOT/emulator.sh"
          install -m 644 presets/cudy-wr3000p-v1.ini "$EMU_ROOT/presets/cudy-wr3000p-v1.ini"
          install -m 644 VERSION "$EMU_ROOT/VERSION"

      - name: Run isolated scenario and produce JSON/JUnit
        shell: bash
        run: |
          set -euo pipefail
          python3 lab/run.py \
            --emulator-root "$EMU_ROOT" \
            --scenario lab/scenarios/openwrt-mt7981.json \
            --preset cudy-wr3000p-v1 \
            --nand-dir "$EMU_ROOT/nand-wr3000p" \
            --output-dir "$RUNNER_TEMP/keenlab-report" \
            --max-seconds 1500

      - name: Publish public-firmware reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-mt7981-lab-report
          path: ${{ runner.temp }}/keenlab-report/
          if-no-files-found: warn
          retention-days: 7
