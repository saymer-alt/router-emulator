# Manual only. This workflow never runs on PR/push and never touches real routers.
# It reuses the same pinned Ported 5.1.8 assets and QEMU cache as mt7621-cloud-lab.yml.
name: NetworkHelm - manual MT7621 Ported RCI guest smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: networkhelm-rci-mt7621-${{ github.ref }}
  cancel-in-progress: true

jobs:
  networkhelm-rci:
    name: Disposable Ported 5.1.8 NDMS CLI + read-only RCI
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify offline NetworkHelm probe contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile lab/networkhelm_rci_probe.py lab/networkhelm_qemu_smoke.py
          python3 -m unittest lab.test_networkhelm_rci_probe lab.test_networkhelm_qemu_smoke -v

      - name: Install pinned-guest preparation and QEMU build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            p7zip-full socat e2fsprogs openssl \
            python3 build-essential ninja-build meson pkg-config \
            libglib2.0-dev libpixman-1-dev zlib1g-dev libslirp-dev libfdt-dev python3-venv

      - name: Restore exact patched MT7621 QEMU build cache
        uses: actions/cache@v4
        id: qemu-cache
        with:
          path: |
            ${{ runner.temp }}/mt7621-qemu/qemu-system-mipsel
            ${{ runner.temp }}/mt7621-qemu/qemu-mipsel.sha256
          key: mipsel-ubuntu24-v10.1.0-${{ hashFiles('qemu-patches/*.patch', 'lab/mt7621/build_qemu_mipsel.sh') }}

      - name: Build patched MT7621 QEMU only on cache miss
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash lab/mt7621/build_qemu_mipsel.sh "$RUNNER_TEMP/mt7621-qemu"

      - name: Verify cached or built QEMU
        shell: bash
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/mt7621-qemu" && sha256sum -c qemu-mipsel.sha256)
          test -x "$RUNNER_TEMP/mt7621-qemu/qemu-system-mipsel"
          echo "QEMU_BIN=$RUNNER_TEMP/mt7621-qemu/qemu-system-mipsel" >> "$GITHUB_ENV"

      - name: Fetch publicly distributed, hash-pinned MT7621 Ported components
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/mt7621-public"
          mkdir -p "$src"
          curl -fL --retry 3 --connect-timeout 15 --max-time 300 \
            -o "$src/breed.bin" 'https://breed.hackpascal.net/breed-mt7621-xiaomi-r3g.bin'
          echo "05ebb31fd889b148022346179346d91c60a1b4518bdc4d8b9717a62aec638bed  $src/breed.bin" | sha256sum -c -
          curl -fL --retry 3 --connect-timeout 15 --max-time 300 \
            -o "$src/ported.bin" 'https://osvault.project-athens.com/osvault/Xiaomi%20R3G/Xiaomi-R3G_5.1.8.bin'
          echo "05958b9786621ee014bb72551f6458d0672c93370cbce9aec3573c6bba038cb2  $src/ported.bin" | sha256sum -c -
          curl -fL --retry 3 --connect-timeout 15 --max-time 300 \
            -o "$src/Xiaomi-R3G.7z" 'https://osvault.project-athens.com/files/firmware/Xiaomi-R3G.7z'
          echo "397e07a20c6a02911e8fd3be756d23c8  $src/Xiaomi-R3G.7z" | md5sum -c -
          7z x -y -o"$src/unpacked" "$src/Xiaomi-R3G.7z" >/dev/null
          python3 -m lab.mt7621.ci_assets --unpacked "$src/unpacked" --out "$src/verified"
          rm -rf "$src/unpacked"

      - name: Assemble disposable 128-MiB Ported 5.1.8 NAND
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/mt7621-public"
          python3 -m lab.mt7621.prepare_ported_mir3g \
            --breed "$src/breed.bin" --firmware "$src/ported.bin" \
            --uconfig "$src/verified/uconfig.bin" \
            --ustate "$src/verified/ustate.bin" \
            --eeprom "$src/verified/eeprom.bin" \
            --out "$RUNNER_TEMP/mt7621-nand"

      - name: Boot actual NDMS CLI guest and test localhost read-only RCI
        id: guest-rci
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -m lab.networkhelm_qemu_smoke \
            --emulator-root . \
            --nand-dir "$RUNNER_TEMP/mt7621-nand" \
            --output-dir "$RUNNER_TEMP/networkhelm-report" \
            --max-seconds 1800

      - name: Gate actual guest and RCI evidence (BLOCKED must not be green)
        if: always()
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/networkhelm-report/networkhelm-summary.json" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, pathlib, sys
          p = pathlib.Path(sys.argv[1])
          summary = pathlib.Path(sys.argv[2])
          if not p.is_file():
              with summary.open("a", encoding="utf-8") as out:
                  out.write("### NetworkHelm: BLOCKED (guest/setup report missing)\n")
              raise SystemExit(1)
          obj = json.loads(p.read_text(encoding="utf-8"))
          guest, rci, outcome = (obj.get(k) for k in ("guest", "rci", "outcome"))
          with summary.open("a", encoding="utf-8") as out:
              out.write(f"### NetworkHelm MT7621 Ported: {outcome}\n")
              out.write(f"Guest NDMS CLI: {guest}; read-only RCI: {rci}\n")
              out.write("No NetworkHelm GUI and no physical router were tested.\n")
          if guest != "PASS" or rci != "PASS" or outcome != "PASS":
              raise SystemExit(1)
          PY

      - name: Publish only sanitized JSON/JUnit (no UART, secrets or flash)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: networkhelm-mt7621-rci-readonly-report
          path: |
            ${{ runner.temp }}/networkhelm-report/report.json
            ${{ runner.temp }}/networkhelm-report/junit.xml
            ${{ runner.temp }}/networkhelm-report/networkhelm-summary.json
            ${{ runner.temp }}/networkhelm-report/networkhelm-rci.json
          if-no-files-found: warn
          retention-days: 7

      - name: Remove private flash/firmware and all raw guest logs
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/mt7621-public" "$RUNNER_TEMP/mt7621-nand" "$RUNNER_TEMP/networkhelm-report"
          echo 'Only explicitly selected sanitized JSON/JUnit reports can be uploaded.'
