# Real KeeneticOS MT7621/MIPSel on ephemeral GitHub Ubuntu runners.
# Public evaluation files are checksum-pinned. No physical routers or private dumps.
#
# Lab CI adapter (this branch only): GitHub runs workflow_dispatch only for a
# workflow whose file exists on the default branch, and the dedicated
# dispatch-only mt7621-kas-runtime-tls-lab.yml exists solely on this branch.
# This registered, dispatchable workflow therefore takes an opt-in
# https_mirror input: dispatching it with -f https_mirror=true runs the full
# KAS MagiTrickle stage over the verified-TLS lab mirror (guest certificate
# verification stays ON, the disposable lab CA private key never leaves the
# runner). pull_request runs and dispatches without the input keep the proven
# ext-utils exception scenario byte-for-byte unchanged.
name: MT7621 - KAS LAB-ONLY ext-utils exception experiment

on:
  pull_request:
    paths:
      - '.github/workflows/mt7621-kas-ext-utils-lab.yml'
      - 'lab/mt7621/kas_smoke.py'
      - 'lab/test_mt7621_kas_smoke.py'
  workflow_dispatch:
    inputs:
      https_mirror:
        description: 'Verified-TLS KAS MagiTrickle stage (lab adapter, this branch only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mt7621-kas-ext-utils-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-guest:
    name: Isolated 5.1.8 QEMU KAS ext-utils exception diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      KAS_REF: 2fcd16089374604e10c201c6cd5a805fba3b100d
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch public KAS at immutable SHA (do not checkout private dev)
        uses: actions/checkout@v4
        with:
          repository: saymer-alt/keenetic-auto-setup
          ref: ${{ env.KAS_REF }}
          path: kas-source
          persist-credentials: false

      - name: Dependencies, offline contracts and exact pinned-source delta
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends p7zip-full socat e2fsprogs openssl \
            python3 python3-paramiko build-essential ninja-build meson pkg-config \
            libglib2.0-dev libpixman-1-dev zlib1g-dev libslirp-dev libfdt-dev python3-venv
          python3 -m unittest discover -s lab -p 'test*.py' -q
          python3 - <<'PY'
          from pathlib import Path
          from lab.mt7621.kas_smoke import (
              lab_only_without_ext_utils_guard, LAB_EXT_UTILS_DISABLED,
              LAB_EXT_UTILS_GUARD,
          )
          original = Path("kas-source/install.sh").read_bytes()
          candidate = lab_only_without_ext_utils_guard(original)
          assert candidate != original and candidate.count(LAB_EXT_UTILS_DISABLED) == 1
          assert candidate.replace(LAB_EXT_UTILS_DISABLED, LAB_EXT_UTILS_GUARD, 1) == original
          print("KAS_LAB_PATCH_CONTRACT_PASS: exactly one conditional, original unmodified")
          PY

      - name: Cache exact patched MIPSel QEMU
        id: qemu-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/mt7621-qemu/qemu-system-mipsel
            ${{ runner.temp }}/mt7621-qemu/qemu-mipsel.sha256
          key: mipsel-ubuntu24-v10.1.0-${{ hashFiles('qemu-patches/*.patch', 'lab/mt7621/build_qemu_mipsel.sh') }}

      - name: Build the native MT7621 QEMU target
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash lab/mt7621/build_qemu_mipsel.sh "$RUNNER_TEMP/mt7621-qemu"

      - name: Verify QEMU binary before guest execution
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c "$RUNNER_TEMP/mt7621-qemu/qemu-mipsel.sha256"
          test -x "$RUNNER_TEMP/mt7621-qemu/qemu-system-mipsel"
          echo "QEMU_BIN=$RUNNER_TEMP/mt7621-qemu/qemu-system-mipsel" >> "$GITHUB_ENV"

      - name: Fetch only public, pinned Ported Xiaomi R3G assets
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/mt7621-public"
          mkdir -p "$src"
          curl -fL --retry 3 --connect-timeout 15 --max-time 300 \
            -o "$src/breed.bin" 'https://breed.hackpascal.net/breed-mt7621-xiaomi-r3g.bin'
          echo "05ebb31fd889b148022346179346d91c60a1b4518bdc4d8b9717a62aec638bed  $src/breed.bin" | sha256sum -c -
          curl -fL --retry 3 --connect-timeout 15 --max-time 300 \
            -o "$src/ported.bin" 'https://osvault.project-athens.com/osvault/Xiaomi%20R3G/Xiaomi-R3G_5.1.8.bin'
          echo "05958b9786621ee014bb72551f6458d0672c93370cbce9aec3573c6bba038cb2  $src/ported.bin" | sha256sum -c -
          curl -fL --retry 3 --connect-timeout 15 --max-time 300 \
            -o "$src/Xiaomi-R3G.7z" 'https://osvault.project-athens.com/files/firmware/Xiaomi-R3G.7z'
          # Vendor public /files/firmware/md5sum; individual NAND parts are SHA256 verified.
          echo "397e07a20c6a02911e8fd3be756d23c8  $src/Xiaomi-R3G.7z" | md5sum -c -
          7z x -y -o"$src/unpacked" "$src/Xiaomi-R3G.7z" >/dev/null
          python3 -m lab.mt7621.ci_assets --unpacked "$src/unpacked" --out "$src/verified"
          rm -rf "$src/unpacked"

      - name: Build disposable 128 MiB Ported NAND using pinned components
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/mt7621-public"
          python3 -m lab.mt7621.prepare_ported_mir3g \
            --breed "$src/breed.bin" --firmware "$src/ported.bin" \
            --uconfig "$src/verified/uconfig.bin" \
            --ustate "$src/verified/ustate.bin" \
            --eeprom "$src/verified/eeprom.bin" \
            --out "$RUNNER_TEMP/mt7621-nand"

      - name: Generate ephemeral synthetic guest credentials (never log)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - "$RUNNER_TEMP/mt7621-credentials.json" <<'PY'
          import json, pathlib, secrets, sys
          pathlib.Path(sys.argv[1]).write_text(json.dumps({
              "username": "root", "password": secrets.token_urlsafe(28)
          }), encoding="utf-8")
          PY

      - name: Run real MIPSel Entware then attempt pinned KAS LAB-COPY install in guest
        id: experiment
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # Default flags are the proven ext-utils exception scenario exactly
          # as registered; the opt-in input switches to the full verified-TLS
          # MagiTrickle stage (--kas-https-mirror serves only the five pinned
          # records from lab/mt7621/kas-mipsel-https.lock.json).
          flags="--max-seconds 2300 --lab-ext-utils-exception"
          if [ "${{ inputs.https_mirror }}" = "true" ]; then
            flags="--max-seconds 2300 --lab-ext-utils-exception --kas-base-deps --kas-mihomo --kas-magitrickle --kas-https-mirror"
          fi
          python3 -m lab.mt7621.kas_smoke \
            --emulator-root . \
            --nand-dir "$RUNNER_TEMP/mt7621-nand" \
            --workspace "$RUNNER_TEMP/mt7621-workspace" \
            --credentials-file "$RUNNER_TEMP/mt7621-credentials.json" \
            --kas-dir "$GITHUB_WORKSPACE/kas-source" --kas-ref "$KAS_REF" \
            $flags

      - name: Evaluate isolated lab experiment evidence (BLOCKED is not KAS PASS)
        if: always()
        shell: bash
        env:
          HTTPS_MIRROR: ${{ inputs.https_mirror }}
        run: |
          python3 - "$RUNNER_TEMP/mt7621-workspace/report/kas-smoke.json" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, os, pathlib, sys
          p = pathlib.Path(sys.argv[1])
          if not p.is_file():
              raise SystemExit("LAB_PROBE_NOT_REACHED: sanitized report missing")
          r = json.loads(p.read_text())
          https_mode = os.environ.get("HTTPS_MIRROR") == "true"
          if (r.get("source_variant") != "DISPOSABLE_LAB_EXT_UTILS_EXCEPTION"
                  or r.get("lab_ext_utils_exception_applied") is not True
                  or r.get("guest_source_verified") is not True
                  or r.get("missing_component_ids") != ["ext-utils"]):
              raise SystemExit("LAB_EXCEPTION_NOT_VERIFIED: source, guest or component drift")
          if https_mode:
              if r.get("schema") != "mt7621-kas-smoke-v3":
                  raise SystemExit("REPORT_SCHEMA_DRIFT")
              required = ("kas_base_deps_feed", "kas_mihomo_feed",
                          "kas_magitrickle_feed", "kas_https_stage",
                          "kas_https_dns_configured", "kas_https_clock_synced",
                          "kas_https_ca_trust_applied",
                          "kas_https_helper_tls_verified")
              missing = [key for key in required if r.get(key) is not True]
              if missing:
                  raise SystemExit("VERIFIED_TLS_STAGE_NOT_PROVEN: %s" % ",".join(missing))
              if r.get("base_packages_installed") != ["ca-bundle", "curl", "jq",
                                                      "iptables", "nano", "cron"]:
                  raise SystemExit("KAS_BASE_IPKS_NOT_INSTALLED")
              if (r.get("socat_package_installed") is not True
                      or r.get("magitrickle_package_installed") is not True
                      or r.get("magitrickle_daemon_running") is not True
                      or r.get("magitrickle_init_script_present") is not True):
                  raise SystemExit("KAS_MAGITRICKLE_STAGE_NOT_PROVEN: the real "
                                   "installer did not deliver a running MagiTrickle")
              if r.get("mihomo_package_installed") is not True:
                  raise SystemExit("KAS_MIHOMO_IPK_NOT_INSTALLED")
          phase, reason = r["phase"], r["reason"]
          if reason == "KEENETICOS_COMPONENTS_MISSING":
              raise SystemExit("LAB_EXCEPTION_DID_NOT_PASS_KAS_COMPONENT_GUARD")
          if phase not in ("BLOCKED", "PASS"):
              raise SystemExit("LAB_EXPERIMENT_UNEXPECTED_PHASE")
          if phase == "PASS" and r.get("kas_installed") is not True:
              raise SystemExit("LAB_INSTALL_INCONSISTENT")
          if phase == "BLOCKED" and r.get("kas_installed") is not False:
              raise SystemExit("LAB_BLOCKED_MISLABELLED")
          with open(sys.argv[2], "a", encoding="utf8") as out:
              if https_mode:
                  out.write("### Verified-TLS KAS MagiTrickle stage (lab adapter on this branch)\n")
                  out.write("HTTPS stage: dns=%s clock=%s ca=%s pinned_helper_tls=%s\n" % (
                      r.get("kas_https_dns_configured"), r.get("kas_https_clock_synced"),
                      r.get("kas_https_ca_trust_applied"),
                      r.get("kas_https_helper_tls_verified")))
                  out.write("Mihomo 1.19.33-1: opkg=%s, ELF -v verified=%s (probe_rc=%s, path=%s, "
                            "output_marker=%s, head=%s, stdout=%s, stderr=%s)\n" % (
                      r.get("mihomo_package_installed"), r.get("mihomo_binary_version_verified"),
                      r.get("mihomo_probe_exit_code"), r.get("mihomo_binary_path"),
                      r.get("mihomo_output_marker"), r.get("mihomo_output_head_marker"),
                      r.get("mihomo_stdout_size"), r.get("mihomo_stderr_size")))
                  if r.get("mihomo_binary_version_verified") is not True:
                      out.write("WARNING: MIPSEL_MIHOMO_ELF_UNPROVEN (head marker above; not KAS PASS)\n")
                  # Read only fixed allowlisted values from the two snapshots.
                  # Never echo arbitrary content from a future/corrupt JSON.
                  policy = r.get("mihomo_version_probe_policy")
                  if policy not in ("not_reached", "legacy_probe", "safe_to_probe",
                                    "skipped_runtime_possible"):
                      policy = "not_reached"
                  out.write("Mihomo extra -v policy: %s\n" % policy)
                  for label, key in (("immediate", "service_diagnostics"),
                                     ("delayed", "service_diagnostics_delayed")):
                      snapshot = r.get(key)
                      if not isinstance(snapshot, dict):
                          snapshot = {}
                      fields = (
                          ("mihomo_process", ("running", "stopped")),
                          ("mihomo_port_7890", ("listening", "not_listening")),
                          ("magitrickle_uptime", ("under_300", "at_least_300")),
                          ("magitrickle_process", ("running", "stopped")),
                      )
                      safe = []
                      for field, allowed in fields:
                          value = snapshot.get(field)
                          safe.append("%s=%s" % (
                              field, value if value in allowed else "unknown"))
                      out.write("Service %s: %s\n" % (label, ", ".join(safe)))
                  out.write("A listening port is not an end-to-end proxy PASS.\n")
              else:
                  out.write("### Disposable Ported 5.1.8 lab exception: VERIFIED\n")
              out.write("KAS experimental installer phase: %s; category: %s\n" % (phase, reason))
              if r.get("installer_error_prefix"):
                  out.write("Matched pinned installer err prefix: `%s`\n" % r["installer_error_prefix"])
              out.write("Neither BLOCKED nor this experiment is production KAS acceptance.\n")
          print("LAB_EXT_UTILS_ONLY_EXCEPTION_REACHED: " + phase + " " + reason)
          PY

      - name: Report only safe action counts (no UART)
        if: always()
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          files = (root/"mt7621-report"/"report.json",
                   root/"mt7621-workspace"/"report"/"report.json")
          source = next((p for p in files if p.is_file()), None)
          with open(sys.argv[2], "a", encoding="utf-8") as out:
              if source:
                  obj = json.loads(source.read_text())
                  rows = obj.get("steps", [])
                  passed = sum(s.get("outcome") == "PASS" for s in rows)
                  out.write(f"### MT7621 real guest: {obj.get('outcome')} ({passed}/{len(rows)} steps)\n")
                  stage = root/"mt7621-workspace"/"report"/"kas-smoke.json"
                  if stage.is_file():
                      result = json.loads(stage.read_text())
                      out.write(f"### KAS installer: {result['phase']} ({result['reason']})\n")
                      out.write("### Lab-only guard exception applied: %s; verified guest source: %s; KAS installed: %s\n" %
                          (result['lab_ext_utils_exception_applied'],result['guest_source_verified'],result['kas_installed']))
              else:
                  out.write("### MT7621 guest not reached: host-side preparation failed\n")
          PY

      - name: Publish sanitized JSON and JUnit only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mt7621-kas-lab-ext-utils-only-public-reports
          path: |
            ${{ runner.temp }}/mt7621-report/report.json
            ${{ runner.temp }}/mt7621-report/junit.xml
            ${{ runner.temp }}/mt7621-workspace/report/report.json
            ${{ runner.temp }}/mt7621-workspace/report/junit.xml
            ${{ runner.temp }}/mt7621-workspace/report/kas-smoke.json
          if-no-files-found: warn
          retention-days: 7

      - name: Remove all firmware, NAND, credentials and private UART
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/mt7621-public" "$RUNNER_TEMP/mt7621-nand" \
            "$RUNNER_TEMP/mt7621-credentials.json" "$RUNNER_TEMP/mt7621-workspace" \
            "$RUNNER_TEMP/mt7621-report"
          echo 'No private NAND, original firmware, KAS guest output or full UART is uploaded.'
