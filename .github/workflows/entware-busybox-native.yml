name: Entware BusyBox native transition research (non-release)

on:
  pull_request:
    paths:
      - 'lab/busybox_transition.py'
      - 'lab/ported_e2e.py'
      - 'lab/gates.py'
      - 'lab/test_busybox_transition.py'
      - '.github/workflows/entware-busybox-native.yml'
      - '.github/workflows/ported-entware-kas.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-busybox:
    name: Disposable QEMU BusyBox 1.37 to 1.38
    uses: ./.github/workflows/ported-entware-kas.yml
    with:
      emulator_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # Fixed known KAS source containing read-only Entware preflight.
      kas_ref: 2ae4a29121f6c7124895d3ece7cf496c74abad54
      stage: busybox-transition
