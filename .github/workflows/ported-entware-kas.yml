name: Ported authenticated Entware KAS laboratory

on:
  workflow_call:
    inputs:
      emulator_ref:
        type: string
        required: true
      kas_ref:
        type: string
        required: true
      stage:
        type: string
        required: false
        default: kas
      profile:
        type: string
        required: false
        default: baseline
      legacy_ip_global:
        type: boolean
        required: false
        default: false
      telemt_ref:
        type: string
        required: false
        default: 0fd4c129a5d1fcb515fb8aa94b8d81da938641b1
  workflow_dispatch:
    inputs:
      emulator_ref:
        description: 'Router Emulator commit to check out (defaults to this ref)'
        required: false
        type: string
      kas_ref:
        description: 'Full 40-hex keenetic-auto-setup commit under test'
        required: false
        type: string
      stage:
        description: 'Lab stage: kas, uninstall-packages, kas-update, web, web-filter, telemt-ipk'
        required: false
        default: kas
        type: string
      profile:
        description: 'kas profile: baseline (full lifecycle) or legacy-bridge (issue #50 fresh Entware + surviving legacy-compatible Proxy0)'
        required: false
        default: baseline
        type: string
      telemt_ref:
        description: 'Exact 40-hex entware-go commit for TeleMT package manager (required by telemt-ipk stage)'
        required: false
        default: '0fd4c129a5d1fcb515fb8aa94b8d81da938641b1'
        type: string
      legacy_ip_global:
        description: 'legacy-bridge A/B: pre-seed Proxy0 with ip global auto as production create does'
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - 'lab/**'
      - 'qemu-patches/0064-hw-arm-filogic-preserve-Keenetic-4.9-FE-receive-IRQ.patch'
      - '.github/workflows/ported-entware-kas.yml'

permissions:
  contents: read

concurrency:
  group: ported-lab-${{ github.ref }}-${{ inputs.stage || 'kas' }}
  cancel-in-progress: true

jobs:
  ported-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          repository: saymer-alt/router-emulator
          ref: ${{ inputs.emulator_ref || github.sha }}
          persist-credentials: false
      - name: Validate immutable laboratory inputs
        env:
          EMULATOR_REF: ${{ inputs.emulator_ref || github.sha }}
          KAS_REF: ${{ inputs.kas_ref || '6dd6438e2b64bad0fe9205ab6575795f808dabd8' }}
        run: |
          [[ "$EMULATOR_REF" =~ ^[a-f0-9]{40}$ ]]
          [[ "$KAS_REF" =~ ^[a-f0-9]{40}$ ]]
      - name: Pinned KAS source as guest input
        if: ${{ inputs.stage != 'telemt-ipk' }}
        uses: actions/checkout@v4
        with:
          repository: saymer-alt/keenetic-auto-setup
          ref: ${{ inputs.kas_ref || '6dd6438e2b64bad0fe9205ab6575795f808dabd8' }}
          path: kas-source
          persist-credentials: false
      - name: Pinned Entware TeleMT script source (QEMU only)
        if: ${{ inputs.stage == 'telemt-ipk' }}
        uses: actions/checkout@v4
        with:
          repository: saymer-alt/entware-go
          ref: ${{ inputs.telemt_ref || '0fd4c129a5d1fcb515fb8aa94b8d81da938641b1' }}
          path: telemt-source
          persist-credentials: false
      - name: Verify pinned input and download current published TeleMT IPKs
        if: ${{ inputs.stage == 'telemt-ipk' }}
        shell: bash
        env:
          TELEMT_REF: ${{ inputs.telemt_ref || '0fd4c129a5d1fcb515fb8aa94b8d81da938641b1' }}
        run: |
          set -euo pipefail
          [[ "$TELEMT_REF" =~ ^[a-f0-9]{40}$ ]]
          test "$(git -C telemt-source rev-parse HEAD)" = "$TELEMT_REF"
          mkdir -p "$RUNNER_TEMP/telemt-ipks"
          base=https://github.com/saymer-alt/entware-go/releases/download/latest
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 180 \
            "$base/telemt_3.5.17-1_aarch64-3.10.ipk" \
            -o "$RUNNER_TEMP/telemt-ipks/telemt_3.5.17-1_aarch64-3.10.ipk"
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 180 \
            "$base/telemt-panel-lite_1.0.0.rc.4-1_aarch64-3.10.ipk" \
            -o "$RUNNER_TEMP/telemt-ipks/telemt-panel-lite_1.0.0.rc.4-1_aarch64-3.10.ipk"
          printf '%s\n' \
            'ccab455710761f236f5da6f2f2a852de575e5db164f59b8157c30e270110e509  telemt_3.5.17-1_aarch64-3.10.ipk' \
            '39053c1e747685183390f0d2f683b2ef72b7d3d9afe97c8724c4358620b64424  telemt-panel-lite_1.0.0.rc.4-1_aarch64-3.10.ipk' |
            (cd "$RUNNER_TEMP/telemt-ipks" && sha256sum --check --status)
          echo 'TELEMT_IPK_INPUTS: verified immutable SHA256 pins'
      - name: Setup Go for optional Web ARM64 guest stage
        if: ${{ inputs.stage == 'web' || inputs.stage == 'web-filter' }}
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Cross-compile the pinned KAS Web bundle for guest
        if: ${{ inputs.stage == 'web' || inputs.stage == 'web-filter' }}
        run: |
          cd kas-source/web/control-center
          go generate ./...
          cmp -s ../../mihomo-doctor.sh scripts/mihomo-doctor.sh
          cmp -s ../../config-import.sh scripts/config-import.sh
          go test ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o kas-control-center-arm64 .
          test "$(stat -c %s kas-control-center-arm64)" -le 33554432
      - name: Host tools and regression contracts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mtd-utils unzip socat curl wget python3 python3-paramiko e2fsprogs openssl build-essential ninja-build meson pkg-config libglib2.0-dev libpixman-1-dev zlib1g-dev libslirp-dev libfdt-dev python3-venv
          python3 -m unittest discover -s lab -p 'test*.py' -v
      - name: Cache the changed AArch64 target by exact patch series
        id: qemu-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/ported-qemu/qemu-system-aarch64
            ${{ runner.temp }}/ported-qemu/qemu.sha256
          key: ported-qemu-ubuntu24-v10.1.0-${{ hashFiles('qemu-patches/*.patch', 'lab/build_qemu.sh') }}
      - name: Build only the required QEMU target after FE IRQ source fix
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        run: bash lab/build_qemu.sh "$RUNNER_TEMP/ported-qemu"
      - name: Retain the built target even when a later guest assertion fails
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/ported-qemu/qemu-system-aarch64
            ${{ runner.temp }}/ported-qemu/qemu.sha256
          key: ported-qemu-ubuntu24-v10.1.0-${{ hashFiles('qemu-patches/*.patch', 'lab/build_qemu.sh') }}
      - name: Pinned emulator wrapper and evaluation firmware
        run: |
          (cd "$RUNNER_TEMP/ported-qemu" && sha256sum -c qemu.sha256)
          bash lab/fetch_lab_assets.sh "$RUNNER_TEMP/ported-assets"
          cp "$RUNNER_TEMP/ported-qemu/qemu-system-aarch64" "$RUNNER_TEMP/ported-assets/downloads/Router-Emulator/qemu/qemu-system-aarch64"
      - name: OpenWrt regression with the same patched QEMU
        run: |
          python3 -m lab.run \
            --emulator-root "$RUNNER_TEMP/ported-assets/downloads/Router-Emulator" \
            --scenario lab/scenarios/openwrt-mt7981.json \
            --preset cudy-wr3000p-v1 \
            --nand-dir "$RUNNER_TEMP/ported-assets/downloads/Router-Emulator/nand-wr3000p" \
            --output-dir "$RUNNER_TEMP/ported-openwrt-private" \
            --max-seconds 900
      - name: Disposable NAND
        run: |
          python3 -m lab.prepare_ported_wr3000p \
            --stock-nand "$RUNNER_TEMP/ported-assets/downloads/Router-Emulator/nand-wr3000p" \
            --ported "$RUNNER_TEMP/ported-assets/downloads/ported.bin" \
            --keenboot "$RUNNER_TEMP/ported-assets/downloads/keenboot.bin" \
            --out "$RUNNER_TEMP/ported-nand"
      - name: Execute independent gates
        run: |
          python3 -m lab.ported_e2e \
            --emulator-root "$RUNNER_TEMP/ported-assets/downloads/Router-Emulator" \
            --nand-dir "$RUNNER_TEMP/ported-nand" \
            --private-dir "$RUNNER_TEMP/ported-private" \
            --report-dir "$RUNNER_TEMP/ported-public" \
            --stage "${{ inputs.stage || 'kas' }}" \
            --profile "${{ inputs.profile || 'baseline' }}" \
            --legacy-ip-global "${{ inputs.legacy_ip_global || 'false' }}" \
            --kas-dir "$GITHUB_WORKSPACE/kas-source" \
            --telemt-dir "$GITHUB_WORKSPACE/telemt-source/telemt" \
            --telemt-ipk-dir "$RUNNER_TEMP/telemt-ipks" \
            --web-bin "$GITHUB_WORKSPACE/kas-source/web/control-center/kas-control-center-arm64" \
            --kas-ref "${{ inputs.kas_ref || '6dd6438e2b64bad0fe9205ab6575795f808dabd8' }}"
      - name: Public fixed-label summary
        if: always()
        run: |
          python3 - "$RUNNER_TEMP/ported-public" <<'PY'
          import pathlib,sys
          from lab.gates import Evidence
          root=pathlib.Path(sys.argv[1])
          if not (root/'gates.json').exists():
              evidence=Evidence()
              evidence.set('BOOT_READY','BLOCKED','runner_failure')
              for gate in tuple(evidence.gates)[1:]:
                  evidence.set(gate,'BLOCKED','prerequisite_blocked')
              evidence.write(root)
          PY
          if [ -f "$RUNNER_TEMP/ported-public/summary.md" ]; then
            cat "$RUNNER_TEMP/ported-public/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'BLOCKED: host preparation did not produce gate evidence.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish sanitized evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ported-gates
          path: |
            ${{ runner.temp }}/ported-public/gates.json
            ${{ runner.temp }}/ported-public/junit.xml
            ${{ runner.temp }}/ported-public/summary.md
          if-no-files-found: warn
          retention-days: 7
      - name: Destroy private firmware, USB, credentials and UART
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/ported-assets" "$RUNNER_TEMP/ported-nand" "$RUNNER_TEMP/ported-private" "$RUNNER_TEMP/ported-openwrt-private" "$RUNNER_TEMP/telemt-ipks"
